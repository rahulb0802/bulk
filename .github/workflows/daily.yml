name: Daily ISR plan

on:
  schedule:
    # 01:00 UTC = 8:00pm CDT (typical school-year timezone)
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install and plan tomorrow
        run: |
          uv sync
          uv run macro plan --date tomorrow
      - name: Upload plan markdown
        uses: actions/upload-artifact@v4
        with:
          name: isr-plan
          path: data/plans/*.md
          if-no-files-found: error
          retention-days: 14
