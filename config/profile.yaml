diet: ovo-lacto vegetarian
protein_g: 135
calories_min: 2200
calories_max: 2400
max_items_per_meal: 6
meal_bands:
  breakfast:
    calories_min: 550
    calories_max: 850
    protein_min: 35
  lunch:
    calories_min: 650
    calories_max: 950
    protein_min: 45
  dinner:
    calories_min: 650
    calories_max: 950
    protein_min: 45
timezone: America/Chicago
# ntfy pings this many minutes before each meal
notify_lead_minutes: 45
meals:
  breakfast: "09:00"
  lunch: "13:00"
  dinner: "19:00"
# Case-insensitive substrings to skip even if vegetarian
dislikes: []
# Extra notes injected into the LLM prompt
notes: >
  Lean bulk for lifting, slight surplus. Dining-hall protein is a hard floor of
  135g (one shake is taken outside this plan — do not include shakes). Calories
  are a day band AND must be split across meals; do not dump most calories into
  one sitting. Each meal needs a protein center plus carbs and some healthyfat, not
  protein-only plates. Fit each meal on one plate when possible. Prefer clean
  foods over dessert, pizza, and fried sides, but flavor and pairing matter: never
  serve a bland starch without a catalog topping, and never put pasta sauce on
  random vegetables.
