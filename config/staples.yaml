# Only add foods you have personally seen at ISR (station, typical serving, macros).
# The planner will not invent always-available items. EatSmart is the source of truth.
#
# Macros below are from ISR Build Your Own on EatSmart (2026-08-29 labels),
# plus cup soy milk and 2 Tbsp peanut butter (typical ISR beverage/condiment
# servings). Prefer soy milk over 2% milk in plans.
# A bagel plus one plain cream cheese cup is 350 kcal (280 + 70).
# EatSmart does not list Greek yogurt at any UIUC dining hall. The always-on
# salad-bar yogurt is Prairie Farms; Plain FF is the highest-protein option.
items:
  - id: staple-bagel
    name: Bagel
    station: Deli & Bagel Bar
    meals: [breakfast]
    serving_size: 4oz Bagel (113g)
    calories: 280
    protein_g: 9
    carbs_g: 60
    fat_g: 1
  - id: staple-cream-cheese
